<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yorn Chaos</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            animation: regenboogAchtergrond 4s infinite linear;
        }

        @keyframes regenboogAchtergrond {
            0% { background-color: #ff0055; }
            25% { background-color: #ffcc00; }
            50% { background-color: #00ff88; }
            75% { background-color: #00ccff; }
            100% { background-color: #ff0055; }
        }

        h1 {
            font-size: 6rem;
            color: white;
            text-shadow: 5px 5px 0px #000;
            text-align: center;
            z-index: 10;
            user-select: none;
            animation: stuiterEnDraai 1.5s infinite ease-in-out;
        }

        @keyframes stuiterEnDraai {
            0%, 100% { transform: scale(1) rotate(-5deg); }
            50% { transform: scale(1.2) rotate(5deg); }
        }

        button {
            z-index: 10;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #000;
            color: #fff;
            border: 4px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.9);
        }

        .zwevend {
            position: absolute;
            font-size: 2.5rem;
            pointer-events: none;
            animation: vliegWeg 3s forwards ease-out;
        }

        @keyframes vliegWeg {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) rotate(720deg) scale(2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <h1 id="hoofdtekst">yorn is dik</h1>
    <button onclick="maakChaos()">Druk hier voor chaos</button>

    <script>
        const teksten = [
            "yorn is dik",
            "YORN IS SUPER DIK",
            "yorn eet alles op 🍔",
            "404: Yorn past niet op het scherm",
            "yorn is dik (bevestigd)"
        ];

        const emojis = ["🍕", "🍔", "🍩", "🍟", "🌮", "🍰", "💥", "🚀", "🎈", "🐷"];

        function maakChaos() {
            // Verander de hoofdtekst naar iets randoms
            const h1 = document.getElementById("hoofdtekst");
            const randomTekst = teksten[Math.floor(Math.random() * teksten.length)];
            h1.innerText = randomTekst;

            // Laat 25 random emoji's ontploffen over het scherm
            for (let i = 0; i < 25; i++) {
                const el = document.createElement("div");
                el.className = "zwevend";
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Start in het midden
                el.style.left = "50%";
                el.style.top = "50%";

                // Willekeurige vliegrichting
                const randomX = (Math.random() - 0.5) * window.innerWidth * 1.5 + "px";
                const randomY = (Math.random() - 0.5) * window.innerHeight * 1.5 + "px";
                el.style.setProperty('--x', randomX);
                el.style.setProperty('--y', randomY);

                document.body.appendChild(el);

                // Verwijder het element na de animatie
                setTimeout(() => {
                    el.remove();
                }, 3000);
            }
        }

        // Laat ook automatisch elke seconde iets willekeurigs vallen
        setInterval(() => {
            const el = document.createElement("div");
            el.className = "zwevend";
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + "vw";
            el.style.top = "-50px";
            el.style.setProperty('--x', (Math.random() - 0.5) * 200 + "px");
            el.style.setProperty('--y', window.innerHeight + 100 + "px");
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }, 500);
    </script>

</body>
</html>
